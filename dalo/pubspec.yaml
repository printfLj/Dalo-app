name: dalo
description: University event registration and QR attendance app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3

  # QR code display
  qr_flutter: ^4.1.0

  # QR code scanning (camera-based, in-app)
  mobile_scanner: ^5.2.3

  # Share / save QR image
  share_plus: ^10.0.3
  path_provider: ^2.1.4
  screenshot: ^3.0.0

  # Google Fonts (Caveat for sketch feel, Inter for body)
  google_fonts: ^6.2.1

  # Misc UI helpers
  intl: ^0.19.0
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
